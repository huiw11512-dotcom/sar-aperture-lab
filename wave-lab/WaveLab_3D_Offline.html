<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6f8">
<title>Wave Lab | 三维空间切片</title><style>:root{--bg:#f3f6f8;--paper:#fff;--ink:#203647;--muted:#6b8190;--line:#dce7ec;--accent:#13899a;--a2:#e9f4f5;--violet:#6b66a9;--orange:#c78043}
*{box-sizing:border-box}
html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}
button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 15px;font-weight:650}
button:hover{border-color:#91c0c9;background:#f6fcfd}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:#117e91;border-color:#117e91;color:#fff}button.primary:hover{background:#0f6d7c}button:disabled{opacity:.5;cursor:wait}
input[type=number],select{min-width:0;width:100%;height:43px;border:1px solid #d1e0e7;border-radius:9px;padding:8px 10px;background:#fff;color:#273e50}
input[type=range]{width:100%;accent-color:var(--accent)}
label{display:block;font-size:13px;color:#597183;font-weight:650;margin-bottom:6px}
.app{display:grid;grid-template-columns:322px minmax(0,1fr);min-height:100vh}
.sidebar{padding:22px 20px 30px;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;max-height:100vh;overflow:auto;scrollbar-width:thin;z-index:2}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:25px}.mark{display:grid;place-items:center;font-weight:800;font-size:23px;width:45px;height:45px;border-radius:12px;background:var(--a2);color:#0d8294}.brand-text{font-size:23px;font-weight:760;letter-spacing:-.6px}
.section{border-top:1px solid #e7eef1;padding-top:20px;margin-top:22px}.section h2{margin:0 0 16px;font-size:16px;font-weight:740;letter-spacing:-.2px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px 11px}.fields.triple{grid-template-columns:repeat(3,1fr);gap:8px}.fields.triple input{padding:7px 5px;text-align:center}.fields.triple label{font-size:12px;text-align:center}
.name-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:750;margin-bottom:13px}
.meta{color:var(--muted);font-size:13px}.inline-actions{display:flex;gap:7px}.inline-actions button{padding:7px 11px;font-size:13px}
.node{border:1px solid #dce8ec;border-radius:11px;padding:13px 12px;margin-bottom:10px;background:#fcfefe}.node-head{display:flex;gap:8px;align-items:center;font-weight:730;font-size:14px;margin-bottom:12px}.node-head .dot{width:9px;height:9px;border-radius:99px;display:inline-block}
.node-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 7px}.node-fields label{font-size:11px;text-align:center;margin-bottom:4px}.node-fields input{height:37px;font-size:13px;padding:7px 3px;text-align:center;border-radius:7px}
.main{padding:27px 32px 45px;max-width:1920px;min-width:0;width:100%;margin:auto}
.headline{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:20px}.headline h1{margin:0;font-size:27px;letter-spacing:-.5px;font-weight:760}
.top-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.status{font-size:13px;font-weight:650;background:#e8f4f5;border-radius:20px;padding:8px 11px;color:#237788}
.card{border:1px solid #dce7eb;border-radius:14px;background:#fff;box-shadow:0 5px 28px rgba(28,61,82,.033)}
.workbar{padding:17px 20px;display:flex;align-items:center;gap:16px;margin-bottom:17px;flex-wrap:wrap}
.workbar .timeline{flex:1;min-width:220px}.timeline .value{font-weight:750;color:#1d778d;font-family:Consolas,monospace;float:right;font-size:14px}
.select-inline{width:auto;min-width:90px;height:40px}.workbar .speed{width:100px}
.figure{padding:20px 20px 22px;margin-bottom:17px}.fig-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:13px}
.fig-head h2{font-size:19px;font-weight:770;margin:0}.mode{display:inline-flex;padding:4px;border:1px solid #dce7eb;border-radius:10px;background:#f7f9fa;gap:4px}
.mode button{border:0;background:transparent;color:#5a7383;padding:9px 14px;font-size:14px;border-radius:7px}.mode button.selected{background:#fff;color:#087e91;box-shadow:0 2px 10px rgba(40,75,87,.11)}
.figure-layout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.slice{min-width:0}.slice h3{display:flex;gap:9px;align-items:center;justify-content:center;font-size:15px;margin:5px 0 7px;font-weight:760}.slice h3 span{font-weight:600;font-size:13px;color:var(--muted)}
.slice canvas{display:block;width:100%;height:auto;aspect-ratio:580/675;cursor:crosshair}
.hintline{font-size:13px;color:#a05d26;margin-top:7px;display:none}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{padding:20px}.panel h2{margin:0 0 13px;font-size:17px}
.scene{height:275px;width:100%;background:linear-gradient(180deg,#fcfeff,#f7fafb);border:1px solid #e6eef1;border-radius:11px;display:block}
.trace{width:100%;height:280px;display:block}.legend{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;margin-top:11px;color:#566f7f;font-size:13px}.legend i{display:inline-block;width:13px;height:4px;margin-right:5px;vertical-align:middle}
.info{display:flex;gap:8px 14px;flex-wrap:wrap;color:#526e7f;font-size:13px;margin-top:12px}.info strong{color:#1c4456}
.details{border-top:1px solid #e8eff2;margin-top:14px;padding-top:12px}.details summary{cursor:pointer;font-weight:630;color:#718696;font-size:13px}.details div{font-size:13px;line-height:1.85;color:#607a89;margin-top:9px}
.footer{margin:22px 0 0;display:flex;justify-content:flex-end;gap:16px;font-size:13px}.footer a{color:#6d8796;text-decoration:none}.footer a:hover{text-decoration:underline}
.lens{position:fixed;display:none;pointer-events:none;width:244px;background:#fff;padding:10px;border:1px solid #cfdee5;border-radius:12px;box-shadow:0 15px 45px rgba(28,51,63,.17);z-index:20}
.lens.show{display:block}.lens-head{font-size:13px;font-weight:740;margin-bottom:8px}.lens canvas{width:222px;height:222px;border:1px solid #dce6ec;image-rendering:pixelated}.lens-pos,.lens-val{font-family:Consolas,monospace;font-size:12px;margin-top:7px;color:#375a69}
@media(max-width:1440px){.app{grid-template-columns:285px minmax(0,1fr)}.main{padding:22px}.figure-layout{gap:7px}.figure{padding:14px}.panel{padding:15px}}
@media(max-width:1020px){.figure-layout{grid-template-columns:repeat(2,minmax(0,1fr))}.lower{grid-template-columns:1fr}.figure-layout .slice:last-child{max-width:570px}}
@media(max-width:780px){.app{display:block}.sidebar{max-height:none;position:static;padding:20px}.main{padding:14px}.headline h1{font-size:23px}.figure-layout{grid-template-columns:1fr}.figure-layout .slice:last-child{max-width:none}.workbar{gap:10px}.slice{max-width:600px;margin:auto}.lower{grid-template-columns:1fr}}


/* Saturated publication heatmap with one global color scale per figure */
:root{--palette-blue:#203ab2;--palette-red:#cf193e}
.fig-head{margin-bottom:11px}
.figure-layout{gap:13px}
.slice canvas{aspect-ratio:580/568}
.slice h3{font-size:17px;margin:4px 0 6px}
.slice h3 span{font-size:15px;color:#506d80}
.shared-scale{max-width:720px;margin:3px auto 8px;padding:3px 10px 0}
.shared-scale-unit{text-align:center;display:block;font-size:15px;font-weight:720;margin:0 0 11px;color:#34576c}
.shared-scale-track{display:flex;align-items:center;gap:15px;color:#426174;font-size:15px;font-variant-numeric:tabular-nums;font-weight:620}
.shared-scale-gradient{height:19px;border:1px solid #bed2db;border-radius:3px;flex:1;background:linear-gradient(to right,#203ab2 0%,#276fec 16.67%,#2ebce0 33.33%,#f7f9fb 50%,#ffc06e 66.67%,#ed4c43 83.33%,#cf193e 100%)}
.shared-scale-track span:last-child{min-width:80px;text-align:right}
.sampling-readout{font-size:14px;color:#356e82;line-height:1.55;padding:14px 0 0;font-weight:650;font-variant-numeric:tabular-nums}
.resolution-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap;padding:15px 3px 0;border-top:1px solid #edf2f5;margin-top:16px}
.resolution-actions button{font-size:14px;padding:9px 15px}
.resolution-summary{font-size:14px;font-weight:600;color:#5e7585;flex:1;min-width:220px}
.hintline{font-size:14px;color:#b0552e;line-height:1.6;padding:8px 4px 0;margin-top:3px}
.top-actions{gap:10px}
@media(max-width:780px){.shared-scale{margin:4px 0 10px}.shared-scale-track{gap:8px}.resolution-summary{flex-basis:100%;min-width:0}.resolution-actions{justify-content:flex-start}}

/* V8: readable labels, interactive orbit scene, no metadata confetti */
.fields.triple label{font-size:14px;font-weight:700}
.node-fields label{font-size:13px;color:#536d7d}
.node-fields input{font-size:15px;height:40px}
.slice h3 span{font-size:15px}
.scene{height:310px;cursor:grab;touch-action:none;user-select:none;border:1px solid #dce8ee;background:#fbfdfe}
.scene.dragging{cursor:grabbing}
.scene-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.scene-heading h2{margin:0!important}
.scene-heading button{font-size:14px;padding:8px 12px}
.legend{font-size:14px;gap:9px 17px}
.footer{font-size:14px}
@media(max-width:780px){.scene{height:285px}.fields.triple label{font-size:14px}}


/* Interactive shared colorbar, keeping one physical display upper limit across all three cuts */
.shared-scale{max-width:1040px;margin:8px auto 10px;padding:4px 10px}
.shared-scale-track{gap:14px;align-items:center}
.shared-scale-track>span:first-child{font-size:16px;font-weight:730;min-width:19px}
.shared-scale-gradient{position:relative;min-width:180px;height:24px;border:1px solid #aebfc9;flex:1;overflow:visible;border-radius:4px;box-shadow:0 1px 3px rgba(22,49,67,.08)}
.shared-scale-gradient input[type="range"]{
 position:absolute;inset:0;top:-9px;width:100%;height:40px;min-width:0;margin:0;
 appearance:none;-webkit-appearance:none;background:transparent;border:0;outline-offset:3px;cursor:ew-resize;
}
.shared-scale-gradient input[type="range"]::-webkit-slider-runnable-track{background:transparent;height:24px}
.shared-scale-gradient input[type="range"]::-moz-range-track{background:transparent;height:24px}
.shared-scale-gradient input[type="range"]::-webkit-slider-thumb{
 appearance:none;-webkit-appearance:none;width:19px;height:32px;margin-top:-4px;
 background:#fff;border:3px solid #1a506b;border-radius:6px;box-shadow:0 1px 7px rgba(8,35,55,.24);cursor:ew-resize;
}
.shared-scale-gradient input[type="range"]::-moz-range-thumb{
 width:16px;height:29px;background:#fff;border:3px solid #1a506b;border-radius:6px;box-shadow:0 1px 7px rgba(8,35,55,.24);cursor:ew-resize;
}
.scale-max-control{display:flex;align-items:center;gap:9px;flex-shrink:0}
.scale-max-control label{margin:0;color:#526d7b;font-weight:680;font-size:14px;white-space:nowrap}
.scale-max-control input{width:120px;min-width:0;height:39px;font-size:15px;font-family:ui-monospace,Consolas,monospace;font-weight:660;padding:7px 9px}
.shared-scale-track #scaleAuto{height:39px;padding:8px 14px;font-size:14px;flex-shrink:0}
@media(max-width:860px){
 .shared-scale-track{flex-wrap:wrap;gap:10px}
 .shared-scale-gradient{flex-basis:calc(100% - 38px)}
 .scale-max-control{margin-left:25px}
}
</style></head>
<body><div class="app">
<aside class="sidebar">
 <div class="brand"><div class="mark">∿</div><div class="brand-text">Wave Lab</div></div>
 <section class="section"><h2>空间与口径</h2>
  <div class="fields">
   <div><label for="freq">频率 / GHz</label><input id="freq" type="number" min=".2" max="100" step="any" value="10"></div>
   <div><label for="pointsPerWave">每波长采样</label><select id="pointsPerWave"><option value="8" selected>8 点 / λ</option><option value="16">16 点 / λ</option></select></div>
   <div><label for="apX">口径长 / λ</label><input id="apX" type="number" min=".5" max="30" value="5" step=".5"></div>
   <div><label for="apY">口径宽 / λ</label><input id="apY" type="number" min=".5" max="30" value="5" step=".5"></div>
   <div><label for="eta">口面效率</label><input id="eta" type="number" min=".01" max="1" value=".7" step=".05"></div>
   <div><label>波长</label><div id="lambdaValue" class="meta" style="padding-top:12px;font-weight:750">29.98 mm</div></div>
  </div><div class="sampling-readout" id="sampleInfo" aria-live="polite">按空间范围自动计算网格</div>
 </section>
 <section class="section"><h2>空间显示范围 / m</h2><div class="fields">
  <div><label for="Lx">X 宽度</label><input id="Lx" type="number" min=".05" max="500" step="any" value="50"></div>
  <div><label for="Ly">Y 宽度</label><input id="Ly" type="number" min=".05" max="500" step="any" value="50"></div>
  <div><label for="zMin">Z 起点</label><input id="zMin" type="number" step="any" value="0"></div>
  <div><label for="Lz">Z 高度</label><input id="Lz" type="number" min=".05" max="500" step="any" value="60"></div>
 </div></section>

 <section class="section"><h2>目标 T / m</h2><div class="fields triple">
  <div><label for="targetX">X</label><input id="targetX" type="number" step="any" value="0"></div>
  <div><label for="targetY">Y</label><input id="targetY" type="number" step="any" value="0"></div>
  <div><label for="targetZ">Z</label><input id="targetZ" type="number" step="any" value="50"></div>
 </div></section>

 <section class="section"><div class="name-row"><h2 style="margin:0">源节点</h2><select id="count" style="width:83px"><option>2</option><option selected>4</option><option>6</option><option>8</option></select></div>
 <div class="inline-actions" style="margin-bottom:13px"><button id="equalPhase">同相</button><button id="randomPhase">随机相位</button></div>
 <div id="nodes"></div></section>
</aside>
<main class="main">
 <header class="headline"><h1>三维空间场 · 正交切片</h1><div class="top-actions"><span class="status" id="status">就绪</span><button id="exportPNG" class="primary">导出论文图</button><select id="csvAxis" class="select-inline" aria-label="CSV导出截面"><option value="x">YZ</option><option value="y">XZ</option><option selected value="z">XY</option></select><button id="exportCSV">导出CSV</button></div></header>
 <div class="workbar card"><button id="play" class="primary">▶ 播放</button><button id="reset">复位</button>
   <div class="timeline"><label for="time">周期时刻 <span id="timeValue" class="value">0.000 T</span></label><input type="range" id="time" min="0" max="1" step=".001" value="0"></div>
   <div class="speed"><label for="speed">播放速度</label><select id="speed"><option value=".25">慢</option><option value=".5" selected>中</option><option value="1">快</option></select></div>
 </div>
 <section class="figure card"><div class="fig-head"><h2>空间场分布</h2><div class="mode"><button id="modeE" class="selected">瞬时电场 |E|</button><button id="modeS">瞬时功率通量 |S|</button></div></div>
  <div class="figure-layout">
   <div class="slice"><h3>YZ 截面 <span id="labelX">x = 0 m</span></h3><canvas id="plotX" width="580" height="568" aria-label="YZ 截面场图"></canvas></div>
   <div class="slice"><h3>XZ 截面 <span id="labelY">y = 0 m</span></h3><canvas id="plotY" width="580" height="568" aria-label="XZ 截面场图"></canvas></div>
   <div class="slice"><h3>XY 截面 <span id="labelZ">z = 50 m</span></h3><canvas id="plotZ" width="580" height="568" aria-label="XY 截面场图"></canvas></div>
  </div>
  <div class="shared-scale" aria-label="三张切片统一色标">
    <span class="shared-scale-unit" id="scaleUnit">瞬时电场强度 · V/m</span>
    <div class="shared-scale-track">
      <span>0</span>
      <div class="shared-scale-gradient" id="scaleGradient">
        <input id="scaleLimit" type="range" min="0" max="1000" step="1" value="1000" aria-label="拖动调整色标最大值" title="拖动调整颜色显示上限">
      </div>
      <div class="scale-max-control">
        <label for="scaleMax">最大值</label>
        <input id="scaleMax" type="number" min="0" step="any" inputmode="decimal" aria-label="直接输入色标最大值">
      </div>
      <button type="button" id="scaleAuto" title="恢复自动色标">自动</button>
    </div>
  </div>
  <div class="resolution-actions">
    <div class="resolution-summary" id="resolutionSummary"></div>
    <button id="localDetail" type="button">局部精细查看</button>
    <button id="restoreOverview" type="button" disabled>恢复全域</button>
  </div>
  <div id="sampleWarning" class="hintline"></div>
 </section>
 <div class="lower">
  <section class="card panel"><div class="scene-heading"><h2>三维空间预览</h2><button id="resetView" type="button" aria-label="重置三维视角">重置视角</button></div>
 <svg id="scene3d" class="scene" viewBox="0 0 650 275" role="img" tabindex="0" aria-label="三维空间预览：鼠标拖动可旋转，滚轮可缩放；右下角显示坐标轴"></svg></section>
  <section class="card panel"><h2>各节点 · 目标位置时域电场</h2><canvas id="trace" class="trace" width="860" height="310"></canvas><div id="legend" class="legend"></div></section>
 </div>
 <footer class="footer"><span>离线单文件版 · 无需联网</span><a href="https://github.com/huiw11512-dotcom/sar-aperture-lab/tree/main/wave-lab" target="_blank" rel="noreferrer">GitHub 源码 ↗</a></footer>
</main></div>
<div id="lens" class="lens" aria-hidden="true"><div class="lens-head">局部放大 · 5×</div><canvas id="lensCanvas" width="444" height="444"></canvas><div class="lens-pos" id="lensCoord">—</div><div class="lens-val" id="lensReading">—</div></div>

<script id="waveLabWorkerCode" type="text/plain">/* Wave Lab 3D: independent, low-power, ideal rectangular-aperture propagation.
   Units: m, Hz, W, peak E (V/m), H (A/m). No finite-aperture near field. */
(function(root){
  "use strict";
  const C=299792458, Z0=376.730313668, TWO=2*Math.PI;
  const clamp=(a,lo,hi)=>Math.max(lo,Math.min(hi,a));
  const sinc=x=>Math.abs(x)<1e-10?1:Math.sin(x)/x;
  const AXES=["x","y","z"];
  const NAMES=["erx","eix","ery","eiy","erz","eiz","hrx","hix","hry","hiy","hrz","hiz"];
  function frame(src,target){
    let nx=target.x-src.x,ny=target.y-src.y,nz=target.z-src.z;
    let r=Math.hypot(nx,ny,nz);
    if(r<1e-8){ nx=0;ny=0;nz=1;r=1; }
    nx/=r;ny/=r;nz/=r;
    let ux,uy,uz,vx,vy,vz;
    if(nz>-0.9999){
      const d=1+nz;
      ux=1-nx*nx/d;uy=-nx*ny/d;uz=-nx;
      vx=-nx*ny/d;vy=1-ny*ny/d;vz=-ny;
    }else{
      ux=1;uy=0;uz=0;vx=0;vy=-1;vz=0;
    }
    return {nx,ny,nz,ux,uy,uz,vx,vy,vz};
  }
  function planePoint(p,axis,u,v){
    const cx=p.centerX||0,cy=p.centerY||0;
    if(axis==="x") return {x:p.cuts.x,y:cy+(u-.5)*p.Ly,z:p.zMin+(1-v)*p.Lz};
    if(axis==="y") return {x:cx+(u-.5)*p.Lx,y:p.cuts.y,z:p.zMin+(1-v)*p.Lz};
    return {x:cx+(u-.5)*p.Lx,y:cy+(.5-v)*p.Ly,z:p.cuts.z};
  }
  function ranges(p,axis){
    if(axis==="x")return {hMin:(p.centerY||0)-p.Ly/2,hMax:(p.centerY||0)+p.Ly/2,vMin:p.zMin,vMax:p.zMin+p.Lz,hName:"y",vName:"z",constant:"x"};
    if(axis==="y")return {hMin:(p.centerX||0)-p.Lx/2,hMax:(p.centerX||0)+p.Lx/2,vMin:p.zMin,vMax:p.zMin+p.Lz,hName:"x",vName:"z",constant:"y"};
    return {hMin:(p.centerX||0)-p.Lx/2,hMax:(p.centerX||0)+p.Lx/2,vMin:(p.centerY||0)-p.Ly/2,vMax:(p.centerY||0)+p.Ly/2,hName:"x",vName:"y",constant:"z"};
  }
  function localPoint(p,axis,x,y){
    const r=ranges(p,axis),u=(x-r.hMin)/(r.hMax-r.hMin),v=(r.vMax-y)/(r.vMax-r.vMin);
    return planePoint(p,axis,u,v);
  }
  function projectPoint(p,axis,world){
    const r=ranges(p,axis),h=world[r.hName],v=world[r.vName];
    return {u:(h-r.hMin)/(r.hMax-r.hMin),v:(r.vMax-v)/(r.vMax-r.vMin),dist:Math.abs(world[axis]-p.cuts[axis])};
  }
  function prepared(p){
    const lambda=C/(p.freq*1e9),k=TWO/lambda;
    const maxD=lambda*Math.hypot(p.apX,p.apY);
    const far=2*maxD*maxD/lambda;
    const gain=4*Math.PI*p.eta*p.apX*p.apY;
    return {lambda,k,far,gain,nodes:p.nodes.map(s=>({src:s,axes:frame(s,p.target)}))};

  for(let i=0;i<len;i++){
   const a=f.erx[i]**2+f.ery[i]**2+f.erz[i]**2;
   const b=f.eix[i]**2+f.eiy[i]**2+f.eiz[i]**2;
   const cross=f.erx[i]*f.eix[i]+f.ery[i]*f.eiy[i]+f.erz[i]*f.eiz[i];
   const ee=(a+b+Math.sqrt((a-b)**2+4*cross*cross))*.5;
   const h=f.hrx[i]**2+f.hry[i]**2+f.hrz[i]**2+f.hix[i]**2+f.hiy[i]**2+f.hiz[i]**2;
   if(ee>maxE*maxE)maxE=Math.sqrt(ee);
